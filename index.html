<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace prospection Nosho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column; search + pinned row, then link groups by category as dense two/three-column lists; add form slides open under the header */
:root{
  --bg:#f4f6f6; --surface:#ffffff; --surface-2:#eef2f2; --line:#d9e0e0;
  --fg:#16211f; --muted:#5d6b69; --accent:#0e6b62; --accent-soft:#d8ece9; --on-accent:#ffffff; --danger:#b33a3a;
  --font-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#17201f; --surface-2:#1e2928; --line:#2c3a38;
  --fg:#e5eceb; --muted:#94a3a1; --accent:#4fc2b4; --accent-soft:#18383a; --on-accent:#0b1413; --danger:#e57373; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#17201f; --surface-2:#1e2928; --line:#2c3a38;
  --fg:#e5eceb; --muted:#94a3a1; --accent:#4fc2b4; --accent-soft:#18383a; --on-accent:#0b1413; --danger:#e57373; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#q{min-width:0;width:260px;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.pinned{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pin{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:inherit;min-width:0;position:relative}
.pin:hover{border-color:var(--accent)}
.pin.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pin.main .dom,.pin.main .note{color:var(--on-accent);opacity:.85}
.pin b{font-size:15px}
.dom{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:12.5px;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
.group h2{margin:0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
.group h2 small{font-weight:500;letter-spacing:0;text-transform:none}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);min-width:0}
.item:nth-child(odd){border-right:1px solid var(--line)}
.item a{color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:1px;min-width:0}
.item a:hover .t{color:var(--accent);text-decoration:underline}
.t{font-weight:600}
.acts{display:flex;gap:2px;opacity:.55}
.item:hover .acts,.item:focus-within .acts{opacity:1}
.ic{font:inherit;font-size:12px;background:none;border:1px solid transparent;color:var(--muted);border-radius:6px;padding:3px 7px;cursor:pointer}
.ic:hover{border-color:var(--line);color:var(--fg)}
.ic[aria-pressed="true"]{color:var(--accent)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.grid .span2{grid-column:span 2}
.grid input,.grid select,.grid textarea{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{font-size:12.5px;color:var(--muted)}.msg.err{color:var(--danger)}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px}
@media (max-width:700px){.list{grid-template-columns:minmax(0,1fr)}.item:nth-child(odd){border-right:0}.grid{grid-template-columns:minmax(0,1fr)}.grid .span2{grid-column:auto}#q{width:100%}}
</style>
<style>[hidden]{display:none!important}body{margin:0}</style>
</head><body>
<div class="wrap">
  <header>
    <div>
      <span class="eyebrow">Alexandre · Nosho</span>
      <h1>Espace prospection</h1>
      <p>Tous les outils et pages de la prospection, au même endroit.</p>
      <p class="note" style="margin-top:6px">Les liens ajoutés depuis cette page restent dans ce navigateur. Pour qu'ils apparaissent partout, demandez à Claude de les ajouter.</p>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Chercher un lien…" aria-label="Chercher un lien">
      <button class="btn" id="addBtn" data-open="1">Ajouter un lien</button>
    </div>
  </header>

  <form class="form" id="form" hidden>
    <div class="row" style="justify-content:space-between"><b id="form-title">Nouveau lien</b><button type="button" class="btn ghost" data-close="1">Fermer</button></div>
    <div class="grid">
      <label>Nom *<input id="f-title" required></label>
      <label>Adresse (https://…) *<input id="f-url" required placeholder="https://"></label>
      <label>Catégorie<input id="f-cat" list="cats" placeholder="Choisir ou créer"><datalist id="cats"></datalist></label>
      <label>Épingler en haut<select id="f-pin"><option value="0">Non</option><option value="1">Oui</option></select></label>
      <label class="span2">Note<input id="f-note" placeholder="À quoi sert ce lien"></label>
    </div>
    <div class="row"><button class="btn" type="submit" id="f-save">Enregistrer</button><span class="msg" id="f-msg"></span></div>
  </form>

  <section id="pinSec" aria-label="Liens épinglés">
    <div class="pinned" id="pinned"></div>
  </section>

  <div id="groups"><div class="empty">Chargement des liens…</div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script id="base" type="application/json">[{"id": "crm", "title": "CRM prospection", "url": "https://claude.ai/artifact/BFJKnBAirmEqTeD2aAXHYS", "cat": "Mes outils", "note": "Fiches, appels, relances du jour, emails, carte", "pinned": true, "main": true, "order": 1}, {"id": "allo", "title": "Allo", "url": "https://web.withallo.com/", "cat": "Appels et emails", "note": "Téléphone, historique et résumés d'appels", "pinned": true, "order": 2}, {"id": "gmail", "title": "Gmail", "url": "https://mail.google.com/", "cat": "Appels et emails", "note": "Boîte mail", "pinned": true, "order": 3}, {"id": "pitchbase", "title": "PitchBase", "url": "https://pitchbase.app/app#history", "cat": "Entraînement", "note": "Simulations d'appels et scores", "pinned": true, "order": 4}, {"id": "allo-resumes", "title": "Allo · résumés d'appels", "url": "https://web.withallo.com/?view=summaries", "cat": "Appels et emails", "note": "Tous les résumés générés par Allo", "order": 10}, {"id": "calendly", "title": "Calendly · démo 15 minutes", "url": "https://calendly.com/alexandre-nosho/15-minutes-meeting", "cat": "Appels et emails", "note": "Lien de prise de rendez-vous", "order": 11}, {"id": "pipeline", "title": "Pipeline CRO (Drive)", "url": "https://drive.google.com/file/d/1rVnuwFMX1z4qENpEnRNrhVBT76pmUqp5/view", "cat": "Mes outils", "note": "Classeur du pipeline", "order": 12}, {"id": "espace-claude", "title": "Espace prospection (version Claude)", "url": "https://claude.ai/artifact/V9zUnBFcHBmVCzUvdaEbni", "cat": "Mes outils", "note": "Même page, hébergée sur Claude", "order": 13}, {"id": "cptshero", "title": "Annuaire des CPTS Auvergne-Rhône-Alpes", "url": "https://www.cptshero.fr/annuaire-cpts/region/auvergne-rhone-alpes", "cat": "Sources de prospects", "note": "CPTShero, liste par département", "order": 20}, {"id": "coordo", "title": "CPTS du Rhône sur Coordo", "url": "https://www.coordo.fr/cpts/departement/69-rhone/", "cat": "Sources de prospects", "note": "Fiches avec bureau et contacts", "order": 21}, {"id": "urps-mk", "title": "URPS kinés ARA · fiches CPTS", "url": "https://urps-mk-ara.org/cpts/cpts-lyon-3/", "cat": "Sources de prospects", "note": "Numéros et coordinateurs à jour (changer la fin de l'adresse selon la CPTS)", "order": 22}, {"id": "annuaire-entreprises", "title": "Annuaire des entreprises", "url": "https://annuaire-entreprises.data.gouv.fr/", "cat": "Sources de prospects", "note": "SIREN, date de création, dirigeants", "order": 23}, {"id": "linkedin", "title": "LinkedIn", "url": "https://www.linkedin.com/", "cat": "Sources de prospects", "note": "Vérifier qui est en poste", "order": 24}, {"id": "nosho-site", "title": "Site Nosho", "url": "https://www.nosho.ai/en", "cat": "Nosho", "note": "", "order": 30}, {"id": "nosho-simulateur", "title": "Simulateur de rentabilité", "url": "https://www.nosho.ai/en/simulateur", "cat": "Nosho", "note": "", "order": 31}, {"id": "allo-mcp", "title": "Connecteur Allo pour Claude", "url": "https://www.withallo.com/mcp", "cat": "Mes outils", "note": "Pour une synchro Allo directe plus tard", "order": 40}]</script>
<script>
const BASE=JSON.parse(document.getElementById("base").textContent);
const KEY="espace-prospection-local-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dom=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(_){return u}};
let local={added:[],edited:{},deleted:[]};try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.added))local=s}catch(_){}
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(local))}catch(_){}};
let links=[], editing=null, confirmDel=null;
const ORDER=["Mes outils","Appels et emails","Sources de prospects","Entraînement","Nosho"];
function compute(){links=[...BASE,...local.added].filter(l=>!local.deleted.includes(l.id)).map(l=>({...l,...(local.edited[l.id]||{})}))}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function match(l){const q=$("#q").value.trim().toLowerCase();return !q||[l.title,l.url,l.cat,l.note].join(" ").toLowerCase().includes(q)}
function render(){
  compute();
  const vis=links.filter(match);
  const pins=vis.filter(l=>l.pinned).sort((a,b)=>(a.order||0)-(b.order||0));
  $("#pinSec").hidden=!pins.length;
  $("#pinned").innerHTML=pins.map(l=>`<a class="pin${l.main?" main":""}" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="dom">${esc(dom(l.url))}</span><b>${esc(l.title)}</b>${l.note?`<span class="note">${esc(l.note)}</span>`:""}</a>`).join("");
  if(!vis.length){$("#groups").innerHTML=`<div class="empty">Aucun lien ne correspond à cette recherche.</div>`;return}
  const cats=[...new Set(vis.map(l=>l.cat||"Autres"))].sort((a,b)=>{const ia=ORDER.indexOf(a),ib=ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
  $("#cats").innerHTML=[...new Set([...ORDER,...links.map(l=>l.cat).filter(Boolean)])].map(c=>`<option value="${esc(c)}">`).join("");
  $("#groups").innerHTML=cats.map(c=>{
    const ls=vis.filter(l=>(l.cat||"Autres")===c).sort((a,b)=>(a.order||0)-(b.order||0)||a.title.localeCompare(b.title));
    return `<section class="group"><h2>${esc(c)} <small>${ls.length}</small></h2><div class="list">${ls.map(l=>`
      <div class="item"><a href="${esc(l.url)}" target="_blank" rel="noopener"><span class="t">${esc(l.title)}</span><span class="dom">${esc(dom(l.url))}</span>${l.note?`<span class="note">${esc(l.note)}</span>`:""}</a>
      <div class="acts">${confirmDel===l.id?`<button class="ic" style="color:var(--danger)" data-delok="${esc(l.id)}">Supprimer ?</button><button class="ic" data-delno="1">Non</button>`:
        `<button class="ic" data-copy="${esc(l.url)}">Copier</button><button class="ic" data-pin="${esc(l.id)}" aria-pressed="${!!l.pinned}">${l.pinned?"Épinglé":"Épingler"}</button><button class="ic" data-edit="${esc(l.id)}">Modifier</button><button class="ic" data-del="${esc(l.id)}">Suppr.</button>`}</div></div>`).join("")}</div></section>`}).join("");
}
function patch(id,data){const a=local.added.find(x=>x.id===id);if(a)Object.assign(a,data);else local.edited[id]={...(local.edited[id]||{}),...data};saveLocal();render()}
function openForm(l){editing=l?l.id:null;$("#form").hidden=false;$("#form-title").textContent=l?"Modifier le lien":"Nouveau lien";
  $("#f-title").value=l?.title||"";$("#f-url").value=l?.url||"";$("#f-cat").value=l?.cat||"";$("#f-note").value=l?.note||"";$("#f-pin").value=l?.pinned?"1":"0";$("#f-msg").textContent="";$("#f-title").focus()}
$("#form").addEventListener("submit",e=>{e.preventDefault();
  const title=$("#f-title").value.trim();let url=$("#f-url").value.trim();const msg=$("#f-msg");
  if(url&&!/^https?:\/\//i.test(url))url="https://"+url;
  try{new URL(url)}catch(_){msg.textContent="Adresse invalide.";msg.className="msg err";return}
  if(!title){msg.textContent="Le nom est obligatoire.";msg.className="msg err";return}
  const data={title,url,cat:$("#f-cat").value.trim()||"Autres",note:$("#f-note").value.trim(),pinned:$("#f-pin").value==="1"};
  if(editing)patch(editing,data);else{local.added.push({...data,id:"l"+Date.now(),order:Date.now()});saveLocal();render()}
  $("#form").hidden=true;toast(editing?"Lien modifié":"Lien ajouté");editing=null;
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.open){openForm(null);return}
  if(b.dataset.close){$("#form").hidden=true;editing=null;return}
  if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast("Adresse copiée")}catch(_){toast(b.dataset.copy)}return}
  if(b.dataset.edit){openForm(links.find(l=>l.id===b.dataset.edit));$("#form").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(b.dataset.pin){const l=links.find(x=>x.id===b.dataset.pin);patch(l.id,{pinned:!l.pinned});return}
  if(b.dataset.del){confirmDel=b.dataset.del;render();return}
  if(b.dataset.delno){confirmDel=null;render();return}
  if(b.dataset.delok){const id=b.dataset.delok;confirmDel=null;local.added=local.added.filter(x=>x.id!==id);if(BASE.some(x=>x.id===id))local.deleted.push(id);saveLocal();render();toast("Lien supprimé");return}
});
$("#q").addEventListener("input",render);
render();
</script>
</body></html>
